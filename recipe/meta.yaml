{% set name = "pathable" %}
{% set version = "0.6.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/p1c2u/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: ee92e59b251ab95f23e2a7f9813c933e6a78c546f00b65b984528dcecbd15b3e

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - poetry-core >=1.0.0
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - pathable
  requires:
    - pip
    - pytest-cov
  commands:
    - pip check
    - pytest -vv tests

about:
  home: https://github.com/p1c2u/pathable
  summary: Object-oriented paths
  description: Object-oriented paths
  dev_url: https://github.com/p1c2u/pathable
  doc_url: https://github.com/p1c2u/pathable
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE

extra:
  recipe-maintainers:
    - bollwyvl
